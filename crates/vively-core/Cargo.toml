[package]
name = "vively-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes = "0.8"
async-trait = "0.1"
cbc = { version = "0.1", features = ["alloc"] }
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "cookies", "gzip", "deflate", "zstd", "json", "multipart", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "time", "rt", "macros"] }
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
zstd = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }
