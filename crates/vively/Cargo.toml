[package]
name = "vively"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "vively"
path = "src/main.rs"

[features]
default = []
test-support = ["gpui-kit/test-support"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
directories = "6.0.0"
futures-channel = "0.3"
futures-util = "0.3"
gpui-kit = "0.10.0"
gpui-webview = "0.10.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lb-wry = "0.53.3"
log = "0.4"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "gzip", "deflate", "zstd", "stream"] }
rfd = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
url = "2"
vively-app = { path = "../vively-app" }
vively-audio = { path = "../vively-audio" }
vively-core = { path = "../vively-core" }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
gpui-kit = { version = "0.10.0", features = ["test-support"] }
serde_json = "1"
tempfile = "3"

