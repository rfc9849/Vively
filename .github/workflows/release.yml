name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Check the version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          with open("crates/vively/Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if os.environ.get("PUBLISH") == "true":
              tag = os.environ["GITHUB_REF_NAME"]
              if tag != f"v{version}":
                  raise SystemExit(f"::error::Tag {tag} does not match Vively version {version}.")
          prerelease = "-" in version.split("+", 1)[0]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"prerelease={str(prerelease).lower()}", file=output)
          PY

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Linux packages
        run: sudo bash scripts/linux-build-deps.sh
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install host and Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libdbus-1-dev
          rustup target add aarch64-linux-android
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -mindepth 2 -maxdepth 3 -name sdkmanager | sort -V | tail -n 1)
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          name=cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2
          curl -fsSL "https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/$name.tgz" -o "$RUNNER_TEMP/$name.tgz"
          echo "9451622c4567e8abb2c8005001855e32901c0b716ccdd3a173a4375fd03426e1  $RUNNER_TEMP/$name.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-ndk" "$HOME/.cargo/bin/cargo-ndk"
          cargo ndk --version
      - name: Prepare the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set."
              exit 1
            fi
            echo "::warning::The signing key is not set. The APK is not signed."
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: vively
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Package
        run: |
          mkdir -p dist
          apk=android/app/build/outputs/apk/release
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)
            "$apksigner" verify --verbose "$apk/app-release.apk"
            expected=$(openssl x509 -in android/release-cert.pem -outform DER | sha256sum | cut -d ' ' -f 1)
            actual=$("$apksigner" verify --print-certs "$apk/app-release.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)
            if [ "$actual" != "$expected" ]; then
              echo "::error::The APK certificate $actual is not the certificate in android/release-cert.pem ($expected)."
              exit 1
            fi
            cp "$apk/app-release.apk" "dist/vively-$VERSION-android.apk"
          else
            cp "$apk/app-release-unsigned.apk" "dist/vively-$VERSION-android-unsigned.apk"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: linux
      - name: Install Linux packages
        run: sudo bash scripts/linux-build-deps.sh
      - name: Build
        run: bash scripts/build.sh linux
      - name: Package
        run: |
          mkdir -p dist
          prefix="$RUNNER_TEMP/vively-linux"
          id=eu.r3pr3ss10n.vively
          install -Dm755 target/release/vively "$prefix/bin/vively"
          install -Dm644 "assets/$id.desktop" "$prefix/share/applications/$id.desktop"
          install -Dm644 assets/AppIcon.png "$prefix/share/icons/hicolor/256x256/apps/$id.png"
          tar -czf "dist/vively-$VERSION-linux-x86_64.tar.gz" -C "$prefix" bin share
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: windows
      - name: Build
        run: cargo build --release --locked -p vively
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -LiteralPath target/release/vively.exe -DestinationPath "dist/vively-${env:VERSION}-windows-x86_64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: macos
      - name: Build
        run: bash scripts/build.sh mac
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent target/release/Vively.app "dist/vively-$VERSION-macos-$(uname -m).zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, test, android, linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Make the checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -- --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          if [ "$PRERELEASE" = true ]; then set -- "$@" --prerelease; fi
          gh release create "$GITHUB_REF_NAME" "$@" dist/*
